<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Era Companion" />
  <title>Era University Daily Companion</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 5rem); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen safe-top safe-bottom">

  <!-- Header -->
  <header class="px-5 pt-3 pb-4 border-b border-slate-800/80 sticky top-0 bg-slate-950/80 backdrop-blur-md z-30 flex justify-between items-center">
    <div>
      <span class="text-xs uppercase tracking-wider text-emerald-400 font-semibold">Era University</span>
      <h1 class="text-xl font-bold tracking-tight">Daily Companion</h1>
    </div>
    <div id="today-date" class="text-xs text-slate-400 text-right"></div>
  </header>

  <!-- TAB 1: EXPENSES -->
  <main id="tab-expenses" class="p-4 space-y-4">
    <!-- Today's Spend Banner -->
    <div class="bg-gradient-to-r from-emerald-600/20 to-teal-600/10 border border-emerald-500/20 rounded-2xl p-4 flex justify-between items-center">
      <div>
        <p class="text-xs text-emerald-300 font-medium uppercase tracking-wider">Aaj Ka Kharcha</p>
        <h2 id="today-total-expense" class="text-3xl font-extrabold text-white mt-0.5">₹0</h2>
      </div>
      <div class="text-right">
        <p class="text-xs text-slate-400">Total Entries</p>
        <span id="today-entry-count" class="text-sm font-semibold text-slate-200">0</span>
      </div>
    </div>

    <!-- Quick Add Form -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> Add Daily Expense
      </h3>

      <!-- Categories -->
      <div class="grid grid-cols-4 gap-2 text-xs">
        <button type="button" onclick="selectCategory('Cigarettes')" class="cat-btn py-2 px-1 rounded-xl border border-slate-700 bg-slate-800/60 font-medium active:scale-95 transition" data-cat="Cigarettes">🚬 Cigarette</button>
        <button type="button" onclick="selectCategory('Chai')" class="cat-btn py-2 px-1 rounded-xl border border-slate-700 bg-slate-800/60 font-medium active:scale-95 transition" data-cat="Chai">☕ Chai</button>
        <button type="button" onclick="selectCategory('Conveyance')" class="cat-btn py-2 px-1 rounded-xl border border-slate-700 bg-slate-800/60 font-medium active:scale-95 transition" data-cat="Conveyance">🚌 Auto/Cab</button>
        <button type="button" onclick="selectCategory('Other')" class="cat-btn py-2 px-1 rounded-xl border border-slate-700 bg-slate-800/60 font-medium active:scale-95 transition" data-cat="Other">✨ Other</button>
      </div>

      <!-- Quick Amount Presets -->
      <div class="flex gap-2">
        <button onclick="setAmount(10)" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold hover:border-emerald-500">₹10</button>
        <button onclick="setAmount(18)" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold hover:border-emerald-500">₹18</button>
        <button onclick="setAmount(20)" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold hover:border-emerald-500">₹20</button>
        <button onclick="setAmount(50)" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold hover:border-emerald-500">₹50</button>
        <button onclick="setAmount(100)" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold hover:border-emerald-500">₹100</button>
      </div>

      <div class="flex gap-2">
        <input type="number" id="expense-amount" placeholder="Amount (₹)" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" />
        <input type="text" id="expense-note" placeholder="Note (optional)" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" />
      </div>

      <button onclick="addExpense()" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 active:scale-98 text-slate-950 font-bold text-sm rounded-xl transition flex items-center justify-center gap-2">
        <i data-lucide="check" class="w-4 h-4"></i> Save Kharcha
      </button>
    </div>

    <!-- Today's Logs -->
    <div class="space-y-2">
      <h3 class="text-xs uppercase font-semibold text-slate-400 tracking-wider">Aaj Ki Entries</h3>
      <div id="expense-list" class="space-y-2">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- TAB 2: ATTENDANCE -->
  <main id="tab-attendance" class="p-4 space-y-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <div class="flex justify-between items-center mb-1">
        <h2 class="text-base font-bold text-slate-200">Overall Attendance</h2>
        <span id="overall-percentage" class="text-lg font-black text-emerald-400">0%</span>
      </div>
      <p class="text-xs text-slate-400">Target: 75% for exam eligibility</p>
    </div>

    <!-- Subjects -->
    <div id="subjects-container" class="space-y-3">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-md border-t border-slate-800/80 px-6 py-2.5 flex justify-around items-center z-40">
    <button onclick="switchTab('expenses')" id="nav-expenses" class="flex flex-col items-center gap-1 text-emerald-400">
      <i data-lucide="wallet" class="w-5 h-5"></i>
      <span class="text-[11px] font-semibold">Kharcha</span>
    </button>
    <button onclick="switchTab('attendance')" id="nav-attendance" class="flex flex-col items-center gap-1 text-slate-500">
      <i data-lucide="graduation-cap" class="w-5 h-5"></i>
      <span class="text-[11px] font-semibold">Attendance</span>
    </button>
  </nav>

  <script>
    // Initial Subjects Setup
    const defaultSubjects = [
      { id: 'cog', name: 'Pharmacognosy', attended: 0, total: 0 },
      { id: 'vidyut', name: 'Vidyut Sir', attended: 0, total: 0 },
      { id: 'minshu', name: 'Minshu Ma\'am', attended: 0, total: 0 },
      { id: 'sadaf', name: 'Sadaf Ma\'am', attended: 0, total: 0 },
      { id: 'python', name: 'Python', attended: 0, total: 0 }
    ];

    let currentCategory = 'Cigarettes';
    let expenses = JSON.parse(localStorage.getItem('era_expenses') || '[]');
    let subjects = JSON.parse(localStorage.getItem('era_subjects') || JSON.stringify(defaultSubjects));

    function init() {
      document.getElementById('today-date').innerText = new Date().toLocaleDateString('en-IN', {
        weekday: 'short', day: 'numeric', month: 'short'
      });
      selectCategory('Cigarettes');
      renderExpenses();
      renderSubjects();
      lucide.createIcons();
    }

    function switchTab(tab) {
      const expTab = document.getElementById('tab-expenses');
      const attTab = document.getElementById('tab-attendance');
      const navExp = document.getElementById('nav-expenses');
      const navAtt = document.getElementById('nav-attendance');

      if (tab === 'expenses') {
        expTab.classList.remove('hidden');
        attTab.classList.add('hidden');
        navExp.className = 'flex flex-col items-center gap-1 text-emerald-400';
        navAtt.className = 'flex flex-col items-center gap-1 text-slate-500';
      } else {
        expTab.classList.add('hidden');
        attTab.classList.remove('hidden');
        navAtt.className = 'flex flex-col items-center gap-1 text-emerald-
