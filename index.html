<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Era Companion" />
  <title>Era Daily Companion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 80px);
    }
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      color: #10b981;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
    }
    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
    }
    .banner {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(6, 78, 59, 0.2));
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .cat-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 10px 4px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .cat-btn.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
    }
    .presets {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
    }
    .chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input {
      background: #090d16;
      border: 1px solid #334155;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      width: 100%;
      outline: none;
    }
    input:focus {
      border-color: #10b981;
    }
    .btn-submit {
      width: 100%;
      background: #10b981;
      color: #042f2e;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .sub-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .sub-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .bar-bg {
      background: #1e293b;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
    }
    .att-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-att {
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      border: 1px solid;
    }
    .btn-present {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .btn-absent {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fb7185;
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: space-around;
      padding: 12px 0 calc(env(safe-area-inset-bottom, 10px) + 8px);
      z-index: 50;
    }
    .nav-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .nav-btn.active {
      color: #10b981;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="badge">Era University</div>
      <h1>Daily Companion</h1>
    </div>
    <div id="today-date" style="font-size: 12px; color: #94a3b8; text-align: right;"></div>
  </header>

  <!-- TAB: EXPENSES -->
  <main id="tab-expenses" class="container">
    <div class="card banner">
      <div>
        <p style="font-size: 11px; text-transform: uppercase; color: #a7f3d0; font-weight: 600;">Aaj Ka Kharcha</p>
        <h2 id="today-total" style="font-size: 32px; font-weight: 800; color: #fff; margin-top: 2px;">₹0</h2>
      </div>
      <div style="text-align: right;">
        <p style="font-size: 11px; color: #94a3b8;">Total Logs</p>
        <p id="today-count" style="font-size: 15px; font-weight: 700; color: #f1f5f9;">0</p>
      </div>
    </div>

    <div class="card">
      <p style="font-size: 13px; font-weight: 700; color: #e2e8f0; margin-bottom: 8px;">Select Category</p>
      <div class="grid-4">
        <button type="button" class="cat-btn active" onclick="setCategory('Cigarettes', this)">🚬 Cigarette</button>
        <button type="button" class="cat-btn" onclick="setCategory('Chai', this)">☕ Chai</button>
        <button type="button" class="cat-btn" onclick="setCategory('Conveyance', this)">🚌 Auto/Cab</button>
        <button type="button" class="cat-btn" onclick="setCategory('Other', this)">✨ Other</button>
      </div>

      <div class="presets">
        <button type="button" class="chip" onclick="setPreset(10)">₹10</button>
        <button type="button" class="chip" onclick="setPreset(18)">₹18</button>
        <button type="button" class="chip" onclick="setPreset(20)">₹20</button>
        <button type="button" class="chip" onclick="setPreset(50)">₹50</button>
        <button type="button" class="chip" onclick="setPreset(100)">₹100</button>
      </div>

      <div class="input-row">
        <input type="number" id="inp-amount" placeholder="Amount (₹)" inputmode="decimal" />
        <input type="text" id="inp-note" placeholder="Note (optional)" />
      </div>

      <button type="button" class="btn-submit" onclick="addExpense()">Save Kharcha</button>
    </div>

    <div>
      <p style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 10px;">Aaj Ki Entries</p>
      <div id="expense-list"></div>
    </div>
  </main>

  <!-- TAB: ATTENDANCE -->
  <main id="tab-attendance" class="container hidden">
    <div class="card banner">
      <div>
        <p style="font-size: 11px; text-transform: uppercase; color: #a7f3d0; font-weight: 600;">Overall Attendance</p>
        <h2 id="overall-pct" style="font-size: 32px; font-weight: 800; color: #fff;">0%</h2>
      </div>
      <p style="font-size: 12px; color: #94a3b8;">Target: 75%</p>
    </div>

    <div id="subjects-container"></div>
  </main>

  <!-- Navigation Bar -->
  <nav>
    <button type="button" id="btn-tab-exp" class="nav-btn active" onclick="switchTab('expenses')">
      <span style="font-size: 18px;">💳</span>
      <span>Kharcha</span>
    </button>
    <button type="button" id="btn-tab-att" class="nav-btn" onclick="switchTab('attendance')">
      <span style="font-size: 18px;">🎓</span>
      <span>Attendance</span>
    </button>
  </nav>

  <script>
    var currentCat = 'Cigarettes';
    var defaultSubjects = [
      { name: 'Pharmacognosy', attended: 0, total: 0 },
      { name: 'Vidyut Sir', attended: 0, total: 0 },
      { name: 'Minshu Ma\'am', attended: 0, total: 0 },
      { name: 'Sadaf Ma\'am', attended: 0, total: 0 },
      { name: 'Python', attended: 0, total: 0 }
    ];

    function getStorage(key, fallback) {
      try {
        var data = localStorage.getItem(key);
        return data ? JSON.parse(data) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function setStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    }

    var expenses = getStorage('era_expenses', []);
    var subjects = getStorage('era_subjects', defaultSubjects);

    function init() {
      var d = new Date();
      var options = { weekday: 'short', day: 'numeric', month: 'short' };
      document.getElementById('today-date').innerText = d.toLocaleDateString('en-IN', options);
      renderExpenses();
      renderSubjects();
    }

    function switchTab(tab) {
      var expTab = document.getElementById('tab-expenses');
      var attTab = document.
